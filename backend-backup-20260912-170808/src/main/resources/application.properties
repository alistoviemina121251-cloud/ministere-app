# =========================================================
# APPLICATION
# =========================================================

spring.application.name=ministere-app

server.port=${PORT:8080}

server.address=0.0.0.0


# =========================================================
# DATABASE - POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}${DB_OPTIONS:}

spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =========================================================
# UPLOADS
# =========================================================

app.upload.dir=${UPLOAD_DIR:/var/data/uploads}

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=25MB


# =========================================================
# FRONTEND
# =========================================================

FRONTEND_URL=${FRONTEND_URL:http://localhost:4200}

app.frontend.url=${FRONTEND_URL:http://localhost:4200}


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never


# =========================================================
# SESSION / COOKIES
# =========================================================

server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}

server.servlet.session.cookie.secure=${COOKIE_SECURE:false}


# =========================================================
# EMAIL SMTP
# =========================================================

spring.mail.host=${MAIL_HOST:}

spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}

spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=10000

spring.mail.properties.mail.smtp.timeout=10000

spring.mail.properties.mail.smtp.writetimeout=10000


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.com.ministre.archive=INFO

logging.level.org.springframework.security=WARN

logging.level.org.hibernate=WARN